name: Deploy to Development

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Create archive
        run: |
          mkdir -p artifacts
          tar -czf artifacts/${{ github.sha }}.tar.gz --exclude=node_modules --exclude=vendor --exclude=tests .

      - name: Upload via rsync
        uses: burnett01/rsync-deployments@v2.0.0
        with:
          switches: -avz --progress -e "ssh -p ${{ matrix.server.port }}"
          path: ${{ github.sha }}.tar.gz
          remote_path: ${{ matrix.server.path }}/artifacts
          remote_host: ${{ matrix.server.ip }}
          remote_user: ${{ matrix.server.username }}
          remote_key: ${{ secrets.SERVER_SSH }}

      - name: SSH and deploy on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /var/www/maaplo

            TIMESTAMP=$(date +\"%Y%m%d%H%M%S\")
            RELEASE_DIR=\"releases/$TIMESTAMP\"
            ARCHIVE=\"artifacts/${{ github.sha }}.tar.gz\"

            echo \"Extracting $ARCHIVE to $RELEASE_DIR...\"
            mkdir -p \"$RELEASE_DIR\"
            tar -xzf \"$ARCHIVE\" -C \"$RELEASE_DIR\"

            echo \"Installing PHP dependencies on server...\"
            cd \"$RELEASE_DIR\"
            composer install --no-interaction --prefer-dist --optimize-autoloader

            echo \"Linking storage...\"
            rm -rf storage
            ln -s /var/www/maaplo/storage storage

            echo \"Running Laravel optimizations...\"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo \"Running database migrations...\"
            php artisan migrate --force

            echo \"Updating current symlink...\"
            ln -sfn \"$RELEASE_DIR\" /var/www/maaplo/current

            echo \"Deployment complete.\"
