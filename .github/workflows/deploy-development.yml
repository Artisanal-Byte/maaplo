name: Deploy Application For Production

on:
  push:
    branches:
      - development

jobs:
  prepare-artifacts:
    name: Prepare Deployment Artifacts
    runs-on: ubuntu-latest
    outputs:
      deployment-matrix: ${{ steps.export-deployment-matrix.outputs.deployment-matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, ctype, fileinfo, openssl, PDO, bcmath, json, tokenizer, xml, sqlite3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node-${{ hashFiles('package-lock.json') }}
          restore-keys: node-

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Create deployment artifact
        run: tar --exclude=.git --exclude=node_modules --exclude=tests -czf "${{ github.sha }}.tar.gz" .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: ${{ github.sha }}.tar.gz

      - name: Export deployment matrix
        id: export-deployment-matrix
        run: |
          JSON=$(cat ./development-server-config.json)
          echo "::set-output name=deployment-matrix::${JSON}"

  deploy:
    name: Deploy to Servers
    needs: prepare-artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server: ${{ fromJson(needs.prepare-artifacts.outputs.deployment-matrix) }}

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH }}

      - name: Rsync deployment artifact to server
        run: |
          rsync -avz -e "ssh -p ${{ matrix.server.port }}" \
            "${{ github.sha }}.tar.gz" \
            "${{ matrix.server.username }}@${{ matrix.server.ip }}:${{ matrix.server.path }}/artifacts/"

      - name: Deploy on remote server
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          key: ${{ secrets.SERVER_SSH }}
          port: ${{ matrix.server.port }}
          script: |
            RELEASE_DIR="${{ matrix.server.path }}/releases/${GITHUB_SHA}"
            ARTIFACT_PATH="${{ matrix.server.path }}/artifacts/${GITHUB_SHA}.tar.gz"
            STORAGE_DIR="${{ matrix.server.path }}/storage"
            CURRENT_LINK="${{ matrix.server.path }}/current"

            mkdir -p "$RELEASE_DIR"
            tar -xzf "$ARTIFACT_PATH" -C "$RELEASE_DIR"

            # Prepare storage directories and permissions
            mkdir -p "$STORAGE_DIR"/{app,public,framework/{cache,sessions,views},logs,database}
            touch "$STORAGE_DIR/database/database.sqlite"
            chown -R ubuntu:www-data "$STORAGE_DIR"
            chmod -R 775 "$STORAGE_DIR"

            # Set permissions for release
            chown -R ubuntu:www-data "$RELEASE_DIR"
            chmod -R 755 "$RELEASE_DIR"

            # Symlink storage and .env
            ln -sfn "$STORAGE_DIR" "$RELEASE_DIR/storage"
            ln -sfn "${{ matrix.server.path }}/.env" "$RELEASE_DIR/.env"

            # Update current symlink
            ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

            # Reload PHP-FPM to pick up changes
            sudo systemctl reload php8.3-fpm

            # Laravel optimization commands
            cd "$CURRENT_LINK"
            php artisan cache:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart

      - name: Clean up old releases and artifacts
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ matrix.server.ip }}
          username: ${{ matrix.server.username }}
          key: ${{ secrets.SERVER_SSH }}
          port: ${{ matrix.server.port }}
          script: |
            RELEASES_DIR="${{ matrix.server.path }}/releases"
            ARTIFACTS_DIR="${{ matrix.server.path }}/artifacts"

            # Keep only last 3 releases
            cd "$RELEASES_DIR" && ls -1dt */ | tail -n +4 | xargs -r rm -rf
            cd "$ARTIFACTS_DIR" && ls -1t | tail -n +4 | xargs -r rm -f
